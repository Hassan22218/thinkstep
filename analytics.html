<!DOCTYPE html>
<html>
<head>
  <title>ThinkStep Analytics</title>
</head>
<body>

<h1>Analytics Dashboard 📊</h1>

<div id="stats">Loading data...</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCpOX49ofIe9Fg9DBHtXC6eyaVE4PJJ0j4",
    authDomain: "thinkstep-v5.firebaseapp.com",
    projectId: "thinkstep-v5",
    storageBucket: "thinkstep-v5.firebasestorage.app",
    messagingSenderId: "109223129442",
    appId: "1:109223129442:web:ec81794bf4a8edee20fc3b"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // 🔥 FORCE DEBUG (IMPORTANT)
  console.log("Analytics page loaded");

  db.collection("attempts").get()
    .then(snapshot => {

      console.log("Data received ✔");

      let data = [];
      snapshot.forEach(doc => data.push(doc.data()));

      let total = data.length;
      let correct = data.filter(d => d.correct).length;

      let avgTime = data.reduce((a,b) => a + b.timeSpent, 0) / (total || 1);
      let hintAvg = data.reduce((a,b) => a + b.hintsUsed, 0) / (total || 1);

      document.getElementById("stats").innerHTML = `
        Total Attempts: ${total}<br><br>
        Correct Answers: ${correct}<br>
        Accuracy: ${((correct/total)*100 || 0).toFixed(2)}%<br><br>

        Avg Time: ${avgTime.toFixed(2)} sec<br>
        Avg Hints Used: ${hintAvg.toFixed(2)}<br><br>

        Weakness Insight:<br>
        ${getInsight(data)}
      `;
    })
    .catch(error => {
      console.error("Firestore error:", error);
      document.getElementById("stats").innerHTML =
        "Error loading data ❌ Check console";
    });

  function getInsight(data){
    let hints = data.filter(d => d.hintsUsed > 1).length;
    if(hints > data.length/2){
      return "Students are heavily dependent on hints.";
    }
    return "Balanced learning pattern.";
  }
</script>

</body>
</html>
