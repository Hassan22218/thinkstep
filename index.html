<!DOCTYPE html>
<html>
<head>
  <title>ThinkStep v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>ThinkStep 🧠</h1>
  <p>Train your thinking, not just answers</p>

  <div id="question-box"></div>

  <input type="text" id="answer" placeholder="Enter your answer">
  <button onclick="checkAnswer()">Submit</button>

  <br><br>

  <button onclick="showHint()">Hint</button>
  <button onclick="showTrap()">Mistake Trap</button>
  <button onclick="showSolution()">Solution</button>
  <button onclick="window.open('analytics.html')">View Analytics 📊
  </button>

  <div id="output"></div>

  <h3 id="score">Score: 0</h3>

</div>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
