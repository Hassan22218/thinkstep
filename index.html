<!DOCTYPE html>
<html>
<head>
  <title>ThinkStep v5</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>ThinkStep 🧠</h1>
  <p>Adaptive Learning System</p>

  <!-- AUTH -->
  <div id="authBox">
    <h3>Student Login / Register</h3>

    <input type="text" id="studentName" placeholder="Enter name">
    <input type="text" id="studentClass" placeholder="Enter class">

    <button onclick="loginStudent()">Start</button>
  </div>

  <hr>

  <!-- QUIZ -->
  <div id="quizBox" style="display:none;">

    <h3 id="welcome"></h3>

    <div id="question-box"></div>

    <input type="text" id="answer" placeholder="Enter answer">
    <button onclick="checkAnswer()">Submit</button>

    <br><br>

    <button onclick="showHint()">Hint</button>
    <button onclick="showTrap()">Mistake Trap</button>
    <button onclick="showSolution()">Solution</button>

    <br><br>

    <button onclick="testFirebase()">Test Firebase</button>
    <button onclick="logout()">Logout</button>

    <div id="output"></div>

    <h3 id="score">Score: 0</h3>

  </div>

</div>

<script src="data.js"></script>
<script src="script.js"></script>
